{% set name = "fps-retrolab" %}
{% set version = "0.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fps_retrolab-{{ version }}.tar.gz
  sha256: ef2c47ce1c1c18557cf566bfd746b77c40e62955aa6d93e629282de7c42f0aa5

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - jupyverse-api >=0.1.4,<1
    - retrolab

test:
  requires:
    - python {{ python_min }}
  imports:
    - fps_retrolab

about:
  home: https://github.com/jupyter-server/jupyverse/tree/main/plugins/retrolab
  summary: An FPS plugin for the RetroLab API
  keywords: jupyter, server, fastapi, plugins
  dev_url: https://github.com/jupyter-server/jupyverse/tree/main/plugins/retrolab
  license_file: COPYING.md
  license: BSD-3-Clause
  license_family: BSD

extra:
  recipe-maintainers:
    - davidbrochart
